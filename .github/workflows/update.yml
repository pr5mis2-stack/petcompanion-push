# 10분마다 잠금화면 카드 갱신 신호를 보낸다. (GitHub 사정으로 몇 분 늦어질 수 있음)
name: 가루 잠금화면 갱신

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node apns.mjs send
        env:
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          CHANNEL_SANDBOX: ${{ secrets.CHANNEL_SANDBOX }}
          CHANNEL_PRODUCTION: ${{ secrets.CHANNEL_PRODUCTION }}
