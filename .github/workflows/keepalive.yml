# 공개 저장소는 60일 동안 변화가 없으면 예약 실행이 멈춘다. 매달 1일에 작은 기록을 남겨 계속 돌게 한다.
name: 가루 예약 유지

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-keepalive.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add last-keepalive.txt
          git commit -m "keepalive" || echo "변화 없음"
          git push
